services:
  postgres:
    image: postgres:15
    container_name: dorado-postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT}:5432'

  backend:
    # Context is the repo root so the pnpm workspace is inside it.
    build:
      context: .
      dockerfile: api/Dockerfile.dev
    container_name: dorado-backend
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      EMAIL_FROM: ${EMAIL_FROM}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_DOMAIN: ${RESEND_FROM_DOMAIN}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE}
    depends_on:
      - postgres
    ports:
      - '5000:5000'

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    container_name: dorado-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - '3000:3000'
    volumes:
      - ./frontend:/repo/frontend
      - /repo/frontend/node_modules
      - /repo/frontend/.next
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: 'true' # Enables file change detection inside Docker
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_AUTH_URL: ${NEXT_PUBLIC_AUTH_URL}
      NEXT_PUBLIC_FRONTEND_URL: ${NEXT_PUBLIC_FRONTEND_URL}

volumes:
  postgres_data:
    driver: local
